services:
  db:
    # Pinned: `latest` moved to Postgres 18, which cannot read a 17 data directory, and
    # an unpinned image would make that jump on an ordinary `docker compose pull`.
    image: paradedb/paradedb:0.26.3-pg17
    environment:
      POSTGRES_DB: masdar
      POSTGRES_USER: masdar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devonly}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U masdar -d masdar"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
