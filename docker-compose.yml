services:
  db:
    image: paradedb/paradedb:latest
    environment:
      POSTGRES_DB: masdar
      POSTGRES_USER: masdar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devonly}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U masdar -d masdar"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
